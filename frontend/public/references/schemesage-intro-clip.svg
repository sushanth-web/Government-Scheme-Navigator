<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SchemeSage animated brand intro</title>
  <desc id="desc">An animated six-second looping SchemeSage brand intro: the symbol draws on, a voice orb pulses, and the tagline appears.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="43%" r="75%"><stop stop-color="#fdfbf3"/><stop offset="1" stop-color="#e8eee5"/></radialGradient>
    <radialGradient id="orb" cx="35%" cy="26%" r="78%"><stop stop-color="#ffedc6"/><stop offset=".5" stop-color="#f3c875"/><stop offset="1" stop-color="#df963f"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="19" flood-color="#355846" flood-opacity=".14"/></filter>
    <style>
      text{font-family:Arial,"Segoe UI",sans-serif}.title{fill:#173d35;font-size:56px;font-weight:700;letter-spacing:-2px}.tag{fill:#6f8075;font-size:18px;letter-spacing:1.5px}.label{fill:#477861;font-size:12px;font-weight:700;letter-spacing:2px}
      .ring{transform-origin:640px 310px;animation:ring 6s ease-in-out infinite}.ring-two{animation-delay:.3s}.orb{transform-origin:640px 310px;animation:breathe 3s ease-in-out infinite}.mark{stroke-dasharray:115;stroke-dashoffset:115;animation:draw 1.3s ease-out .3s forwards}.word{opacity:0;animation:rise .8s ease-out 1.1s forwards}.tagline{opacity:0;animation:rise .8s ease-out 1.7s forwards}.spark{transform-box:fill-box;transform-origin:center;animation:sparkle 2.4s ease-in-out infinite}.spark-b{animation-delay:.6s}.spark-c{animation-delay:1.2s}
      @keyframes ring{0%,100%{transform:scale(.91);opacity:.35}50%{transform:scale(1.06);opacity:.8}}
      @keyframes breathe{0%,100%{transform:scale(.97)}50%{transform:scale(1.03)}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes sparkle{0%,100%{opacity:.4;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle class="ring" cx="640" cy="310" r="196" fill="none" stroke="#6e9a78" stroke-opacity=".36" stroke-width="1.5"/>
  <circle class="ring ring-two" cx="640" cy="310" r="164" fill="none" stroke="#edaa4b" stroke-opacity=".45" stroke-width="1.3"/>
  <path class="spark" d="m398 244 5 11 11 5-11 5-5 11-5-11-11-5 11-5 5-11Z" fill="#edaa4b"/>
  <path class="spark spark-b" d="m860 281 4 9 9 4-9 4-4 9-4-9-9-4 9-4 4-9Z" fill="#6f9876"/>
  <path class="spark spark-c" d="m792 131 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Z" fill="#edaa4b"/>
  <g class="orb" filter="url(#shadow)">
    <circle cx="640" cy="310" r="108" fill="url(#orb)"/>
    <circle cx="640" cy="310" r="107" fill="none" stroke="#f7e0ae" stroke-width="1"/>
    <rect x="625" y="265" width="30" height="60" rx="15" fill="none" stroke="#725522" stroke-width="5"/>
    <path d="M606 301a34 34 0 0 0 68 0m-34 39v24m-16 0h32" fill="none" stroke="#725522" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(615 60)">
    <path d="m25 2 20 11v22L25 46 5 35V13L25 2Z" fill="#e3eee1" stroke="#477861" stroke-width="2"/>
    <path class="mark" d="m16 24 7 7 13-15" fill="none" stroke="#477861" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="word title" x="640" y="518" text-anchor="middle">Scheme<tspan fill="#477861" font-weight="400">Sage</tspan></text>
  <text class="tagline tag" x="640" y="563" text-anchor="middle">A clearer path to public benefits</text>
  <text x="640" y="632" text-anchor="middle" class="label">LISTEN  ·  UNDERSTAND  ·  TAKE YOUR NEXT STEP</text>
</svg>
