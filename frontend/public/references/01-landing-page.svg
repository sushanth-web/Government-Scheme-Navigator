<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">SchemeSage landing page reference</title>
  <desc id="desc">A warm cream and evergreen landing page with the SchemeSage brand, a clear try now button, friendly scheme cards, and a three-step explainer.</desc>
  <defs>
    <linearGradient id="orb" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#fff0c9"/><stop offset=".48" stop-color="#f3c875"/><stop offset="1" stop-color="#df963f"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#254538" flood-opacity=".12"/></filter>
    <style>
      text{font-family:Arial,"Segoe UI",sans-serif}.muted{fill:#77847b}.green{fill:#477861}.ink{fill:#173d35}.tiny{font-size:11px}.small{font-size:14px}.head{font-size:15px;font-weight:700}.h1{font-size:62px;font-weight:750;letter-spacing:-3px}.h2{font-size:37px;font-weight:700;letter-spacing:-1px}
    </style>
  </defs>
  <rect width="1440" height="920" fill="#f7f6f1"/>
  <path d="M0 0h1440v82H0z" fill="#f7f6f1"/>
  <path d="M54 80h1332" stroke="#e5e4dc"/>
  <rect x="57" y="24" width="34" height="34" rx="10" fill="#e5eee4"/>
  <path d="m74 30 11 6v11l-11 6-11-6V36l11-6Z" fill="none" stroke="#477861" stroke-width="2"/>
  <path d="m69 41 4 4 7-8" fill="none" stroke="#477861" stroke-width="2" stroke-linecap="round"/>
  <text x="101" y="47" class="ink head">Scheme<tspan class="green" font-weight="400">Sage</tspan></text>
  <text x="530" y="45" class="muted tiny">How it works</text><text x="650" y="45" class="muted tiny">Languages</text><text x="742" y="45" class="muted tiny">Your privacy</text>
  <rect x="1267" y="23" width="116" height="38" rx="7" fill="#173d35"/>
  <text x="1291" y="47" fill="#fffefa" class="tiny" font-weight="700">Try now</text><text x="1354" y="47" fill="#fffefa" class="small">→</text>
  <text x="60" y="145" class="green tiny" font-weight="700" letter-spacing="2">✦  A FRIENDLIER WAY TO FIND SUPPORT</text>
  <text x="58" y="227" class="ink h1">Find schemes</text><text x="58" y="290" class="ink h1">that fit.</text><text x="58" y="353" class="green h1">Just by talking.</text>
  <text x="62" y="397" class="muted small">Tell SchemeSage a little about yourself. Explore government schemes,</text><text x="62" y="420" class="muted small">understand why they may fit, and get a clear checklist for what to do next.</text>
  <rect x="60" y="457" width="157" height="51" rx="7" fill="#edaa4b"/><text x="80" y="488" class="ink small" font-weight="700">Try now</text><text x="183" y="488" class="ink small">→</text>
  <circle cx="246" cy="483" r="9" fill="#e1eee0"/><path d="m242 483 3 3 5-6" fill="none" stroke="#477861" stroke-width="1.5"/><text x="263" y="487" class="muted tiny">No sign-up. No login.</text>
  <text x="63" y="550" class="muted tiny">◎  Talk in the language you feel at home in</text>
  <circle cx="1041" cy="306" r="194" fill="none" stroke="#dfe8dc"/><circle cx="1041" cy="306" r="162" fill="none" stroke="#f0dbb8"/>
  <circle cx="1041" cy="306" r="116" fill="url(#orb)" filter="url(#shadow)"/>
  <rect x="1019" y="261" width="44" height="53" rx="19" fill="#fff7df" opacity=".7"/>
  <rect x="1032" y="269" width="18" height="35" rx="9" fill="none" stroke="#705323" stroke-width="3"/>
  <path d="M1024 292a17 17 0 0 0 34 0m-17 18v14m-9 0h18" fill="none" stroke="#705323" stroke-width="3" stroke-linecap="round"/>
  <text x="981" y="341" fill="#705323" class="tiny" font-weight="700" letter-spacing="1">READY WHEN YOU ARE</text>
  <g filter="url(#shadow)" transform="rotate(-5 890 211)">
    <rect x="768" y="152" width="232" height="142" rx="12" fill="#fffefa"/><text x="789" y="180" class="muted tiny" font-weight="700">✳  FARMING</text><text x="789" y="210" class="ink head">Farm household support</text><text x="789" y="233" class="muted tiny">Support for eligible families</text><rect x="789" y="251" width="106" height="22" rx="11" fill="#e7efe3"/><text x="800" y="266" fill="#477551" class="tiny">●  Possible match</text>
  </g>
  <g filter="url(#shadow)" transform="rotate(4 1183 432)">
    <rect x="1080" y="367" width="224" height="142" rx="12" fill="#fffefa"/><text x="1100" y="395" class="muted tiny" font-weight="700">▤  EDUCATION</text><text x="1100" y="425" class="ink head">Student assistance</text><text x="1100" y="448" class="muted tiny">Help for students and families</text><rect x="1100" y="466" width="108" height="22" rx="11" fill="#fff0dd"/><text x="1111" y="481" fill="#9a6b27" class="tiny">●  Explore criteria</text>
  </g>
  <g filter="url(#shadow)"><rect x="780" y="488" width="198" height="59" rx="10" fill="#fffefa"/><rect x="793" y="501" width="34" height="34" rx="8" fill="#e6efe5"/><text x="838" y="514" class="ink tiny" font-weight="700">Tell us about you</text><text x="838" y="531" class="muted tiny">Age, work and location</text></g>
  <g filter="url(#shadow)"><rect x="1100" y="531" width="211" height="59" rx="10" fill="#fffefa"/><rect x="1113" y="544" width="34" height="34" rx="8" fill="#f8e4cf"/><text x="1158" y="557" class="ink tiny" font-weight="700">Your next steps</text><text x="1158" y="574" class="muted tiny">A checklist you can follow</text></g>
  <path d="M56 624h1328" stroke="#e5e4dc"/><text x="61" y="661" class="green tiny" font-weight="700" letter-spacing="1.6">DESIGNED AROUND YOU</text><text x="917" y="661" class="muted tiny">Speak or type  ·  One question at a time  ·  Clear next steps</text>
  <rect y="690" width="1440" height="230" fill="#efeee6"/>
  <text x="59" y="748" class="green tiny" font-weight="700" letter-spacing="1.5">A SIMPLE, HUMAN PROCESS</text>
  <text x="58" y="801" class="ink h2">Three small steps.</text><text x="58" y="843" class="ink h2">A little more clarity.</text>
  <g filter="url(#shadow)">
    <rect x="582" y="728" width="248" height="158" rx="10" fill="#fbfaf6" stroke="#e2e1d7"/><text x="604" y="759" class="green tiny" font-weight="700">01  ─────────  ◌</text><text x="604" y="792" class="ink head">Tell us about you</text><text x="604" y="818" class="muted tiny">Age, work and district. Speak or type</text><text x="604" y="838" class="muted tiny">whatever feels comfortable.</text>
    <rect x="846" y="728" width="248" height="158" rx="10" fill="#fbfaf6" stroke="#e2e1d7"/><text x="868" y="759" class="green tiny" font-weight="700">02  ─────────  ✦</text><text x="868" y="792" class="ink head">Explore schemes</text><text x="868" y="818" class="muted tiny">See possible matches and why</text><text x="868" y="838" class="muted tiny">they may be worth a closer look.</text>
    <rect x="1110" y="728" width="248" height="158" rx="10" fill="#fbfaf6" stroke="#e2e1d7"/><text x="1132" y="759" class="green tiny" font-weight="700">03  ─────────  ✓</text><text x="1132" y="792" class="ink head">Get a checklist</text><text x="1132" y="818" class="muted tiny">Know what to prepare and</text><text x="1132" y="838" class="muted tiny">where to confirm your next steps.</text>
  </g>
</svg>
