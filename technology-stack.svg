<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" role="img" aria-labelledby="title description">
  <title id="title">SchemeSage technology stack</title>
  <desc id="description">Layered technology stack for SchemeSage: React and TypeScript frontend, Vercel hosting, FastAPI and LangGraph backend, NVIDIA and Gnani AI services, and ChromaDB and PostgreSQL data stores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#e9eef7"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#115e59"/>
      <stop offset="1" stop-color="#256d74"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#668078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { fill: #153b36; font-size: 34px; font-weight: 750; }
      .subtitle { fill: #607771; font-size: 17px; }
      .row { fill: #eef2f5; stroke: #d2dce1; stroke-width: 1.5; }
      .row-label { fill: #375d57; font-size: 14px; font-weight: 750; letter-spacing: 1.1px; }
      .card { fill: #fff; stroke: #d4dfdc; stroke-width: 1.4; }
      .teal { fill: #edf7f4; stroke: #a7cbc1; }
      .blue { fill: #eff3fb; stroke: #bdcbe0; }
      .gold { fill: #fff7e9; stroke: #e5d1a6; }
      .stack-title { fill: #173e38; font-size: 18px; font-weight: 700; }
      .copy { fill: #60756e; font-size: 14px; }
      .small { fill: #72847e; font-size: 12px; }
      .arrow { fill: none; stroke: #668078; stroke-width: 2.1; marker-end: url(#arrow); }
      .pill { fill: #d8ece6; }
      .pill-text { fill: #23665b; font-size: 11px; font-weight: 700; }
      .note { fill: #44665e; font-size: 13px; }
    </style>
  </defs>

  <rect width="1400" height="940" rx="26" fill="url(#bg)"/>
  <text x="54" y="62" class="title">SchemeSage | Technology stack</text>
  <text x="54" y="92" class="subtitle">The technologies used in each layer of the running application</text>

  <rect x="50" y="128" width="1300" height="126" rx="18" class="row"/>
  <rect x="50" y="128" width="210" height="126" rx="18" fill="url(#header)"/>
  <text x="78" y="178" fill="#fff" font-size="17" font-weight="750">PRESENTATION</text>
  <text x="78" y="207" fill="#d7f1eb" font-size="13">Browser application</text>
  <rect x="286" y="151" width="245" height="80" rx="13" class="card teal"/>
  <text x="306" y="182" class="stack-title">React 18 + TypeScript</text>
  <text x="306" y="208" class="copy">Reusable, typed user interface</text>
  <rect x="550" y="151" width="220" height="80" rx="13" class="card"/>
  <text x="570" y="182" class="stack-title">Vite</text>
  <text x="570" y="208" class="copy">Dev server and production build</text>
  <rect x="789" y="151" width="235" height="80" rx="13" class="card"/>
  <text x="809" y="182" class="stack-title">React Router</text>
  <text x="809" y="208" class="copy">Landing, language, conversation</text>
  <rect x="1043" y="151" width="279" height="80" rx="13" class="card"/>
  <text x="1063" y="182" class="stack-title">Lucide · Vercel metrics</text>
  <text x="1063" y="208" class="copy">Icons · Analytics · Speed Insights</text>

  <path d="M700 257v31" class="arrow"/>
  <rect x="50" y="292" width="1300" height="102" rx="18" class="row"/>
  <rect x="50" y="292" width="210" height="102" rx="18" fill="#256c67"/>
  <text x="78" y="337" fill="#fff" font-size="17" font-weight="750">HOSTING</text>
  <text x="78" y="365" fill="#d7f1eb" font-size="13">Routing and delivery</text>
  <rect x="286" y="313" width="1036" height="60" rx="13" class="card teal"/>
  <text x="310" y="340" class="stack-title">Vercel Services</text>
  <text x="310" y="362" class="copy">Frontend and Python backend deploy together · /api/* → FastAPI · remaining routes → Vite static site</text>

  <path d="M700 397v31" class="arrow"/>
  <rect x="50" y="432" width="1300" height="148" rx="18" class="row"/>
  <rect x="50" y="432" width="210" height="148" rx="18" fill="#315f86"/>
  <text x="78" y="490" fill="#fff" font-size="17" font-weight="750">APPLICATION</text>
  <text x="78" y="519" fill="#e0eafa" font-size="13">API and orchestration</text>
  <text x="78" y="542" fill="#e0eafa" font-size="13">Python 3.12+</text>
  <rect x="286" y="453" width="300" height="104" rx="13" class="card blue"/>
  <text x="306" y="486" class="stack-title">FastAPI + Uvicorn</text>
  <text x="306" y="513" class="copy">REST endpoints and async streams</text>
  <text x="306" y="538" class="small">Server-Sent Events for turn updates</text>
  <rect x="604" y="453" width="300" height="104" rx="13" class="card"/>
  <text x="624" y="486" class="stack-title">LangChain</text>
  <text x="624" y="513" class="copy">Models, tools, and retrieval links</text>
  <text x="624" y="538" class="small">Agent integrations and prompts</text>
  <rect x="922" y="453" width="400" height="104" rx="13" class="card"/>
  <text x="942" y="486" class="stack-title">LangGraph</text>
  <text x="942" y="513" class="copy">Intake, matching, checklist agents</text>
  <text x="942" y="538" class="small">Conversation state and checkpoints</text>

  <path d="M700 583v31" class="arrow"/>
  <rect x="50" y="618" width="1300" height="136" rx="18" class="row"/>
  <rect x="50" y="618" width="210" height="136" rx="18" fill="#87612c"/>
  <text x="78" y="671" fill="#fff" font-size="17" font-weight="750">AI SERVICES</text>
  <text x="78" y="700" fill="#fff1d6" font-size="13">Models and speech</text>
  <rect x="286" y="639" width="327" height="94" rx="13" class="card blue"/>
  <text x="306" y="672" class="stack-title">NVIDIA API</text>
  <text x="306" y="699" class="copy">Nemotron chat / ranking models</text>
  <text x="306" y="721" class="small">Nemotron multilingual embeddings</text>
  <rect x="631" y="639" width="327" height="94" rx="13" class="card gold"/>
  <text x="651" y="672" class="stack-title">Gnani Vachana</text>
  <text x="651" y="699" class="copy">Speech-to-text transcription API</text>
  <text x="651" y="721" class="small">Selected locale sent with audio</text>
  <rect x="976" y="639" width="346" height="94" rx="13" class="card gold"/>
  <text x="996" y="672" class="stack-title">Gnani Timbre v3</text>
  <text x="996" y="699" class="copy">Text-to-speech · Shivani voice</text>
  <text x="996" y="721" class="small">Audio reply returned to the browser</text>

  <path d="M700 757v31" class="arrow"/>
  <rect x="50" y="792" width="1300" height="112" rx="18" class="row"/>
  <rect x="50" y="792" width="210" height="112" rx="18" fill="#4b7565"/>
  <text x="78" y="840" fill="#fff" font-size="17" font-weight="750">DATA</text>
  <text x="78" y="869" fill="#e2f0e9" font-size="13">Knowledge and state</text>
  <rect x="286" y="813" width="320" height="70" rx="13" class="card teal"/>
  <text x="306" y="843" class="stack-title">ChromaDB</text>
  <text x="306" y="867" class="copy">Vector retrieval index</text>
  <rect x="623" y="813" width="320" height="70" rx="13" class="card"/>
  <text x="643" y="843" class="stack-title">Scheme PDF documents</text>
  <text x="643" y="867" class="copy">Source material for retrieval</text>
  <rect x="960" y="813" width="362" height="70" rx="13" class="card"/>
  <text x="980" y="843" class="stack-title">PostgreSQL / Neon</text>
  <text x="980" y="867" class="copy">Sessions and production checkpoints</text>

  <rect x="50" y="916" width="14" height="14" rx="7" class="pill"/>
  <text x="74" y="928" class="note">Local development: Vite proxies /api to FastAPI; session storage can use in-memory mode when DATABASE_URL is not set.</text>
</svg>
